name: 01 - PR Gatekeeper

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REPO_NAME: "petclinic-repo-dev"
  IMAGE_NAME: "petclinic"

jobs:
  pr-lifecycle:
    # ARC scale set name (GKE WI → github-app-runner-sa-dev); no Docker socket
    runs-on: petclinic-arc-dev
    environment: dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Require GCP project vars
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ]; then
            echo "::error::Set GCP_PROJECT_ID and GCP_REGION on the GitHub Environment 'dev' (Settings → Environments → dev). Repo-level vars are not used for two GCP projects."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up gcloud (ADC via GKE Workload Identity)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Static Analysis (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Package Application
        run: ./mvnw package -DskipTests

      - name: Prepare image context
        uses: ./.github/actions/prepare-image-context

      - name: Registry auth (WI token)
        uses: ./.github/actions/registry-auth
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Build image with Kaniko
        uses: ./.github/actions/kaniko-build
        with:
          destination: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          tar-path: /tmp/pr_image.tar

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/pr_image.tar
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push image to dev registry
        uses: ./.github/actions/crane-push-tar
        with:
          tar-path: /tmp/pr_image.tar
          destinations: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest
