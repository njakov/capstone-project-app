# Namespace: petclinic (set via helm --namespace; WI = petclinic/petclinic)
# Project-specific fields (image.repository, googleProjectId, cloudSql.instanceConnectionName,
# serviceAccount.gcpEmail) are injected at deploy time via --set / GitHub Actions vars.
replicaCount: 2

serviceAccount:
  name: petclinic

ingress:
  enabled: true
  className: "nginx"
  host: "petclinic.internal"

environment: "prod"
