name: 02 - Main Branch Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REPO_NAME_PROD: "petclinic-repo-prod"
  IMAGE_NAME: "petclinic"

jobs:
  build-and-release:
    # ARC scale set name (GKE WI → github-app-runner-sa-prod); no Docker socket
    runs-on: petclinic-arc-prod
    environment: prod
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    permissions:
      contents: write

    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}

    steps:
      - name: Clean Workspace
        run: find "${GITHUB_WORKSPACE}" -mindepth 1 -delete 2>/dev/null || true

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Require GCP project vars
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ]; then
            echo "::error::Set GCP_PROJECT_ID and GCP_REGION on the GitHub Environment 'prod' (Settings → Environments → prod). Repo-level vars are not used for two GCP projects."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up gcloud (ADC via GKE Workload Identity)
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.x"

      - name: Install SemVer
        run: pip install semver

      - name: Get Latest Tag
        uses: actions-ecosystem/action-get-latest-tag@v1.6.0
        id: get-latest-tag

      # Tag is pushed only after tests + Trivy pass
      - name: Calculate Next Version
        id: semver
        run: |
          LATEST="${{ steps.get-latest-tag.outputs.tag }}"
          NEW_TAG=$(python3 scripts/bump_version.py "$LATEST")
          echo "Current: $LATEST"
          echo "Next: $NEW_TAG"
          echo "new_version=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Static Analysis (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Package Application
        run: ./mvnw package -DskipTests

      - name: Prepare image context
        uses: ./.github/actions/prepare-image-context

      - name: Registry auth (WI token)
        uses: ./.github/actions/registry-auth
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Build image with BuildKit
        uses: ./.github/actions/buildkit-build
        with:
          destination: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME_PROD }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.new_version }}
          tar-path: /tmp/release_image.tar

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/release_image.tar
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push New Tag
        uses: actions-ecosystem/action-push-tag@v1
        with:
          tag: ${{ steps.semver.outputs.new_version }}
          message: "Release ${{ steps.semver.outputs.new_version }}"

      - name: Push image to prod registry
        uses: ./.github/actions/crane-push-tar
        with:
          tar-path: /tmp/release_image.tar
          destinations: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME_PROD }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.new_version }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME_PROD }}/${{ env.IMAGE_NAME }}:latest
