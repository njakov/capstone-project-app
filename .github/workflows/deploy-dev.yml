name: Deploy to dev

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REPO_NAME: "petclinic-repo-dev"
  IMAGE_NAME: "petclinic"
  TARGET_ENV: "dev"

jobs:
  build-and-deploy-dev:
    # Shared dev cluster: main is what lives here. Prod stays manual (03).
    runs-on: petclinic-arc-dev
    environment: dev
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Require GCP project vars
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$REGION" ]; then
            echo "::error::Set GCP_PROJECT_ID and GCP_REGION on the GitHub Environment 'dev' (Settings → Environments → dev)."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up gcloud (ADC via GKE Workload Identity)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Static Analysis (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Package Application
        run: ./mvnw package -DskipTests

      - name: Prepare image context
        uses: ./.github/actions/prepare-image-context

      - name: Registry auth (WI token)
        uses: ./.github/actions/registry-auth
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev

      - name: Build image with BuildKit
        uses: ./.github/actions/buildkit-build
        with:
          destination: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
          tar-path: /tmp/dev_image.tar

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/dev_image.tar
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Push image to dev registry
        uses: ./.github/actions/crane-push-tar
        with:
          tar-path: /tmp/dev_image.tar
          destinations: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to dev with Helm
        env:
          TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          gcloud container clusters get-credentials "petclinic-gke-${TARGET_ENV}" \
            --zone "europe-west1-c" --project "${PROJECT_ID}"

          FULL_IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}"
          SA_EMAIL="petclinic-sa-${TARGET_ENV}@${PROJECT_ID}.iam.gserviceaccount.com"
          SQL_INSTANCE="${PROJECT_ID}:${REGION}:petclinic-db-${TARGET_ENV}"

          helm upgrade --install petclinic ./chart/petclinic \
            --namespace petclinic \
            --values ./chart/petclinic/values-${TARGET_ENV}.yaml \
            --set image.repository="$FULL_IMAGE" \
            --set image.tag="$TAG" \
            --set googleProjectId="${PROJECT_ID}" \
            --set serviceAccount.gcpEmail="$SA_EMAIL" \
            --set cloudSql.instanceConnectionName="$SQL_INSTANCE" \
            --wait

      - name: Verify Deployment
        run: |
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          INGRESS_HOST=$(kubectl get ingress -n petclinic petclinic \
            -o jsonpath='{.spec.rules[0].host}')
          echo "---------------------------------------------------"
          echo "DEPLOYED to dev  tag=$(git rev-parse --short=7 HEAD)"
          echo "Ingress LB IP:  http://$INGRESS_IP"
          echo "Ingress Host:   $INGRESS_HOST"
          echo "---------------------------------------------------"
          if [ -z "$INGRESS_IP" ]; then
            echo "::warning::ingress-nginx LoadBalancer IP not ready yet"
          fi
