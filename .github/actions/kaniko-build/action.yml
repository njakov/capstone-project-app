name: Kaniko build
description: Build a container image with the Kaniko executor binary (no Docker daemon / socket).

inputs:
  context:
    description: Build context directory
    required: false
    default: "."
  dockerfile:
    description: Path to Dockerfile
    required: false
    default: "Dockerfile"
  destination:
    description: Primary image reference (used for naming inside the tar)
    required: true
  tar-path:
    description: Path to write the image tarball
    required: false
    default: "/tmp/kaniko-image.tar"
  kaniko-version:
    description: Kaniko executor image tag to extract
    required: false
    default: "v1.23.2"
  crane-version:
    description: go-containerregistry (crane) release tag
    required: false
    default: "v0.20.2"

runs:
  using: composite
  steps:
    - name: Install crane and Kaniko executor
      shell: bash
      run: |
        set -euo pipefail
        TOOLS_DIR="${RUNNER_TEMP}/kaniko-tools"
        mkdir -p "${TOOLS_DIR}/bin" "${TOOLS_DIR}/root"

        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64|amd64) CRANE_ARCH="x86_64" ;;
          aarch64|arm64) CRANE_ARCH="arm64" ;;
          *) echo "Unsupported arch: ${ARCH}" >&2; exit 1 ;;
        esac

        curl -fsSL \
          "https://github.com/google/go-containerregistry/releases/download/${{ inputs.crane-version }}/go-containerregistry_Linux_${CRANE_ARCH}.tar.gz" \
          | tar -xz -C "${TOOLS_DIR}/bin" crane

        "${TOOLS_DIR}/bin/crane" export \
          "gcr.io/kaniko-project/executor:${{ inputs.kaniko-version }}" \
          - | tar -x -C "${TOOLS_DIR}/root" kaniko/executor
        chmod +x "${TOOLS_DIR}/root/kaniko/executor"

        echo "${TOOLS_DIR}/bin" >> "${GITHUB_PATH}"
        echo "KANIKO_EXECUTOR=${TOOLS_DIR}/root/kaniko/executor" >> "${GITHUB_ENV}"

    - name: Build image tarball with Kaniko
      shell: bash
      run: |
        set -euo pipefail
        CONTEXT_DIR="$(cd "${{ inputs.context }}" && pwd)"
        DOCKERFILE_PATH="${CONTEXT_DIR}/${{ inputs.dockerfile }}"
        if [[ "${{ inputs.dockerfile }}" = /* ]]; then
          DOCKERFILE_PATH="${{ inputs.dockerfile }}"
        fi

        "${KANIKO_EXECUTOR}" \
          --context="dir://${CONTEXT_DIR}" \
          --dockerfile="${DOCKERFILE_PATH}" \
          --destination="${{ inputs.destination }}" \
          --tarPath="${{ inputs.tar-path }}" \
          --no-push \
          --verbosity=info

        ls -lh "${{ inputs.tar-path }}"
