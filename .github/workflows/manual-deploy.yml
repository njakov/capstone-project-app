name: 03 - Manual Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      version:
        description: "Version Tag to Deploy (e.g., v1.0.4 or a1b2c3d)"
        required: true
        type: string

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  REPO_NAME_DEV: "petclinic-repo-dev"
  REPO_NAME_PROD: "petclinic-repo-prod"
  IMAGE_NAME: "petclinic"

jobs:
  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    # ARC scale set name for the target env (GKE WI → github-app-runner-sa-{env})
    runs-on: petclinic-arc-${{ inputs.environment }}

    # Enables "Required Reviewers" protection if 'prod' is selected
    environment: ${{ inputs.environment }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Require GCP project vars
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ] || [ -z "${{ vars.GCP_REGION }}" ]; then
            echo "::error::Set repository variables GCP_PROJECT_ID and GCP_REGION"
            exit 1
          fi

      - name: Set up gcloud (ADC via GKE Workload Identity)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Validate & Select Registry
        id: config
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TAG: ${{ inputs.version }}
        run: |
          echo "Analyzing deployment request..."

          SEMVER_REGEX="^v[0-9]+\.[0-9]+\.[0-9]+$"

          if [[ "$TAG" =~ $SEMVER_REGEX ]]; then
            IS_SEMVER="true"
            echo "Tag '$TAG' is a Release Version."
          else
            IS_SEMVER="false"
            echo "Tag '$TAG' is a Dev/Hash Version."
          fi

          # PROD GUARDRAIL: Only allow SemVer on Prod
          if [[ "$TARGET_ENV" == "prod" && "$IS_SEMVER" == "false" ]]; then
            echo "::error::CRITICAL: You cannot deploy non-SemVer tags to Production."
            exit 1
          fi

          # Dev env → dev registry; prod env → prod registry
          if [[ "$TARGET_ENV" == "prod" ]]; then
            REPO_NAME="${{ env.REPO_NAME_PROD }}"
          else
            REPO_NAME="${{ env.REPO_NAME_DEV }}"
          fi

          FULL_IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/$REPO_NAME/${{ env.IMAGE_NAME }}"
          echo "Selected Registry: $REPO_NAME"
          echo "image_repository=$FULL_IMAGE_URL" >> $GITHUB_OUTPUT
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Check Image Existence
        env:
          IMAGE_URL: ${{ steps.config.outputs.image_repository }}
          TAG: ${{ inputs.version }}
        run: |
          echo "Checking if image exists: $IMAGE_URL:$TAG"

          if gcloud artifacts docker images describe "$IMAGE_URL:$TAG" > /dev/null 2>&1; then
            echo "Image found! Proceeding..."
          else
            echo "::error::Image $IMAGE_URL:$TAG NOT FOUND. Please check the version tag."
            exit 1
          fi

      - name: Deploy with Helm
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          echo "Deploying ${{ inputs.version }} to $TARGET_ENV"
          # Dev cluster is zonal. Prod cluster is regional. Terraform creates the namespace.
          if [ "$TARGET_ENV" = "prod" ]; then
            gcloud container clusters get-credentials "petclinic-gke-${TARGET_ENV}" \
              --region "${{ env.REGION }}" --project "${{ env.PROJECT_ID }}"
          else
            gcloud container clusters get-credentials "petclinic-gke-${TARGET_ENV}" \
              --zone "europe-west1-c" --project "${{ env.PROJECT_ID }}"
          fi

          FULL_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/$REPO_NAME/${{ env.IMAGE_NAME }}"
          SA_EMAIL="petclinic-sa-${TARGET_ENV}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          SQL_INSTANCE="${{ env.PROJECT_ID }}:${{ env.REGION }}:petclinic-db-${TARGET_ENV}"
          echo "Deploying Image: $FULL_IMAGE:${{ inputs.version }}"

          helm upgrade --install petclinic ./chart/petclinic \
            --namespace petclinic \
            --values ./chart/petclinic/values-${TARGET_ENV}.yaml \
            --set image.repository="$FULL_IMAGE" \
            --set image.tag="${{ inputs.version }}" \
            --set googleProjectId="${{ env.PROJECT_ID }}" \
            --set serviceAccount.gcpEmail="$SA_EMAIL" \
            --set cloudSql.instanceConnectionName="$SQL_INSTANCE" \
            --wait

      - name: Verify Deployment
        run: |
          # App Service is ClusterIP; external access is via ingress-nginx LoadBalancer
          INGRESS_IP=$(kubectl get svc -n ingress-nginx ingress-nginx-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          INGRESS_HOST=$(kubectl get ingress -n petclinic petclinic \
            -o jsonpath='{.spec.rules[0].host}')
          echo "---------------------------------------------------"
          echo "DEPLOYMENT SUCCESSFUL to ${{ inputs.environment }}"
          echo "Ingress LB IP:  http://$INGRESS_IP"
          echo "Ingress Host:   $INGRESS_HOST"
          echo "Namespace:      petclinic"
          echo "---------------------------------------------------"
          if [ -z "$INGRESS_IP" ]; then
            echo "::warning::ingress-nginx LoadBalancer IP not ready yet"
          fi
